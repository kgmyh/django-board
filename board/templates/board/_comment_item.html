<div class="media mb-3" data-comment-id="{{ comment.pk }}">
  <div class="media-body w-100">
    <div class="d-flex justify-content-between align-items-start">
      <div>
        <strong>{{ comment.writer.name|default:comment.writer.username }}</strong>
        <span class="text-muted small">{{ comment.create_at|date:"Y/m/d H:i" }}</span>
      </div>
      <div data-role="actions">
        {% if user.is_authenticated and user.pk == comment.writer.pk %}
          <button class="btn btn-sm btn-outline-primary" data-action="edit">수정</button>
          <button class="btn btn-sm btn-outline-danger" data-action="delete">삭제</button>
        {% endif %}
      </div>
    </div>
    <div class="mt-2" data-role="content">{{ comment.content|linebreaksbr }}</div>
  </div>
</div>
