upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 20M;

    # Static files
    location /static/ {
        alias /static/;
        access_log off;
        expires 7d;
    }

    # Media files
    location /media/ {
        alias /media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

